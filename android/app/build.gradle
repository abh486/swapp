apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.swappios"

    defaultConfig {
        applicationId "com.swappios"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.0.12"

        // FIX FOR react-native-camera
        missingDimensionStrategy 'react-native-camera', 'general'

        // Auth0 Config
        manifestPlaceholders = [
                auth0Domain: "login.swapp.fit",
                auth0Scheme: "com.swappios.auth0"
        ]

        ndk {
         abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file(MYAPP_UPLOAD_STORE_FILE)
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug

            // Allows Metro HTTP connection
            manifestPlaceholders.usesCleartextTraffic = "true"
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds

            // Security for production
            manifestPlaceholders.usesCleartextTraffic = "false"

            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.fresco:animated-gif:3.6.0")
    implementation("com.facebook.fresco:animated-webp:3.6.0")
    implementation("com.facebook.fresco:webpsupport:3.6.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Android Credential Manager
    implementation("androidx.credentials:credentials:1.6.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
}

apply plugin: "com.google.gms.google-services"

tasks.configureEach { task ->
    if (task.name.startsWith("externalNativeBuildClean")) {
        task.enabled = false
    }
}

tasks.named("clean") {
    doLast {
        delete file("${projectDir}/.cxx")
    }
}
